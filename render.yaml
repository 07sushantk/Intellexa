services:
  - type: web
    name: researchmind-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app1.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
